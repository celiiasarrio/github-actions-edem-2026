name: Python PR-v

on:
  pull_request:
    types: [synchronize, opened, reopened]
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  linting:
    runs-on: ubuntu-latest

    steps:
    # Checkout the repository
    - name: Checkout code
      uses: actions/checkout@v4 # Para poder acceder al código del repositorio, es necesario hacer un checkout del mismo. Esto se hace con la acción "actions/checkout@v4", que es una acción oficial de GitHub Actions. Esta acción permite clonar el repositorio en el runner donde se ejecuta el workflow, lo que permite acceder a los archivos del proyecto para realizar las tareas necesarias, como instalar dependencias, ejecutar pruebas, lintear el código, etc. Sin este paso, no sería posible interactuar con el código del proyecto dentro del workflow.

    # Set up Python
    - name: Set up Python
      uses: actions/setup-python@v4 # Esta acción oficial de GitHub Actions se utiliza para configurar el entorno de Python en el runner donde se ejecuta el workflow. Permite especificar la versión de Python que se desea utilizar, lo que es esencial para garantizar que las dependencias y el código del proyecto sean compatibles con esa versión. En este caso, se está configurando Python 3.9, lo que asegura que todas las tareas posteriores, como la instalación de dependencias y la ejecución de pruebas, se realicen en un entorno con esa versión específica de Python.
      with:
        python-version: '3.9'

    # Install dependencies
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r code/python/requirements.txt
        pip install flake8 bandit 

    # Run tests
    - name: Run tests
      run: python -m unittest discover -s code/python -p "test_*.py" 

    # Run linters
    - name: Run linters
      run: flake8 code/python

    # Run security checks
    - name: Run security checks
      run: bandit -r code/python

    # Lint Dockerfile
    - name: Lint Dockerfile
      uses: hadolint/hadolint-action@v3.1.0
      with:
        dockerfile: code/python/DockerFile

  docker:
    runs-on: ubuntu-latest
    needs: linting
    steps:
    # Checkout the repository
    - name: Checkout code
      uses: actions/checkout@v4

    # Set up Docker Buildx
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # Build Docker image
    - name: Build Docker image
      uses: docker/build-push-action@v6
      with:
        push: false
        tags: python-app:latest
        file: code/python/DockerFile
        context: . # El contexto de construcción se establece en la raíz del repositorio, lo que permite acceder a todos los archivos necesarios para construir la imagen Docker, incluyendo el Dockerfile ubicado en "code/python/DockerFile". Esto es importante porque el Dockerfile puede referenciar otros archivos o directorios dentro del proyecto, y al establecer el contexto en la raíz, se asegura que todos esos recursos estén disponibles durante el proceso de construcción de la imagen.